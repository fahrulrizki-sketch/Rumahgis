name: Threads Local Rain Publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Ketik PUBLISH_RUMAHGIS_LOCAL_RAIN_20260902 untuk menyetujui utas hujan lokal'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: threads-local-rain-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.TOKEN_THREADS_RUMAHGIS }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      PAYLOAD: content/drafts/2026-09-02-hujan-lokal-di-musim-kemarau.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify explicit publication confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "PUBLISH_RUMAHGIS_LOCAL_RAIN_20260902" ]; then
            echo "Confirmation text did not match; no content was published."
            exit 2
          fi
      - name: Run automated tests
        run: npm test
      - name: Validate affiliate product bank
        run: npm run validate:affiliate
      - name: Validate reviewed content
        run: node scripts/validate-thread.mjs "$PAYLOAD"
      - name: Dry-run reviewed content
        run: node scripts/threads-publisher.mjs "$PAYLOAD"
      - name: Run read-only Threads account healthcheck
        run: node scripts/threads-healthcheck.mjs
      - name: Publish reviewed thread
        run: node scripts/threads-publisher.mjs "$PAYLOAD" --publish
