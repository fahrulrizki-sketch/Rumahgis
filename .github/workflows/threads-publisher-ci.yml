name: Threads Publisher CI

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/posting.example.json'
      - 'config/affiliate-products.json'
      - 'package.json'
      - '.github/workflows/threads-publisher-ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/posting.example.json'
      - 'config/affiliate-products.json'
      - 'package.json'
      - '.github/workflows/threads-publisher-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit and integration tests
        run: npm test
      - name: Validate example payload
        run: node scripts/validate-thread.mjs config/posting.example.json
      - name: Validate affiliate product bank
        run: npm run validate:affiliate
      - name: Dry-run publisher
        run: node scripts/threads-publisher.mjs config/posting.example.json
