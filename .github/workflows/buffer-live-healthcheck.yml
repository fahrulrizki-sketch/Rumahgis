name: Buffer live healthcheck

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/buffer.mjs
      - scripts/buffer-healthcheck.mjs
      - tests/buffer.test.mjs
      - .github/workflows/buffer-live-healthcheck.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Verify Buffer account and channels
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: node scripts/buffer-healthcheck.mjs
