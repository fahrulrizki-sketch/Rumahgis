name: Instagram approved Kalimantan test
on:
  push:
    branches: ['feat/instagram-cross-publishing']
    paths: ['.github/workflows/instagram-approved-test.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: instagram-approved-kalimantan-test
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cegah eksekusi kedua
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = '1'
          count=$(gh api "repos/$GH_REPO/actions/workflows/instagram-approved-test.yml/runs?per_page=1" --jq '.total_count')
          test "$count" = '1'
      - run: npm test
      - name: Terbitkan carousel yang disetujui ke rumahgis
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.TOKEN_INSTAGRAM_RUMAHGIS }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/instagram-approved-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-approved-test-result
          path: instagram-test-result.json
          if-no-files-found: ignore
