name: RumahGIS Megathrust Jawa dua platform
on:
  push:
    branches: ['feat/instagram-cross-publishing']
    paths: ['.github/workflows/megathrust-approved-publish.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: rumahgis-social-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Batasi satu eksekusi untuk tema ini
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = '1'
          count=$(gh api "repos/$GH_REPO/actions/workflows/megathrust-approved-publish.yml/runs?per_page=1" --jq '.total_count')
          test "$count" = '1'
      - run: npm test
      - name: Preview kedua platform
        run: node scripts/social-publisher.mjs content/drafts/megathrust-jawa-20260910.json
      - name: Terbitkan tema yang diminta ke Threads dan Instagram
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.TOKEN_THREADS_RUMAHGIS }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.TOKEN_INSTAGRAM_RUMAHGIS }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/publish-megathrust-approved.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megathrust-jawa-publish-state
          path: .social-state/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
